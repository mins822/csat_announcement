<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>탐구1 영역 – 천을 밀고 올라오는 시계</title>
<style>
:root{--stage:#ecebe9;--ink:#1a1a1a;--btn:#1d1d1f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:var(--stage);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;pointer-events:none;font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",Arial,sans-serif}
#title{position:absolute;left:0;right:0;text-align:center;transform:translateY(-50%);margin:0;color:var(--ink);font-family:"Noto Serif KR","Nanum Myeongjo","Batang","Times New Roman",serif;font-weight:900;letter-spacing:-.04em;white-space:nowrap}
#face{position:absolute}
#face svg{width:100%;height:100%;display:block;overflow:visible}
#lab{position:absolute;display:flex;justify-content:space-between;color:var(--ink);font-weight:800;font-style:italic;letter-spacing:-.03em;line-height:1.15;font-family:"Arial Narrow","Helvetica Neue",Arial,sans-serif}
#lab div:last-child{opacity:.32;text-align:right}

/* ---------- iOS 27.2.1 Liquid Glass Controls ---------- */
#dock{
  position:fixed;
  left:50%;
  bottom:calc(env(safe-area-inset-bottom,0px) + 34px);
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:10px;
  z-index:10;
  transition:opacity .38s cubic-bezier(.22,1,.36,1),transform .38s cubic-bezier(.22,1,.36,1);
}
#dock.ui-hidden{
  opacity:0;
  pointer-events:none;
  transform:translateX(-50%) translateY(10px) scale(.96);
}
.btn-group{
  display:flex;
  align-items:center;
  gap:10px;
}
.hidden{
  display:none !important;
}
.lg-btn{
  position:relative;
  overflow:hidden;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.78);
  background:linear-gradient(145deg,rgba(255,255,255,.66) 0%,rgba(255,255,255,.24) 48%,rgba(240,246,255,.50) 100%);
  -webkit-backdrop-filter:blur(26px) saturate(200%) brightness(1.06);
  backdrop-filter:blur(26px) saturate(200%) brightness(1.06);
  box-shadow:
    inset 0 1.5px 1px rgba(255,255,255,.96),
    inset 0 -1.5px 2px rgba(255,255,255,.52),
    inset 0 0 18px rgba(255,255,255,.32),
    0 10px 28px -6px rgba(18,22,32,.15),
    0 2px 6px rgba(0,0,0,.06);
  color:var(--btn);
  font:600 14px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Apple SD Gothic Neo",Arial,sans-serif;
  letter-spacing:.18em;
  cursor:pointer;
  white-space:nowrap;
  transition:transform .25s cubic-bezier(.22,1,.36,1),box-shadow .25s ease,background .25s ease,opacity .3s ease;
}
.lg-btn::before{
  content:"";
  position:absolute;
  inset:1px 10% 52% 10%;
  border-radius:999px;
  background:linear-gradient(180deg,rgba(255,255,255,.78) 0%,rgba(255,255,255,0) 100%);
  pointer-events:none;
}
.lg-btn:hover{
  transform:translateY(-1.5px) scale(1.025);
  background:linear-gradient(145deg,rgba(255,255,255,.78) 0%,rgba(255,255,255,.34) 48%,rgba(245,250,255,.62) 100%);
  box-shadow:
    inset 0 1.5px 1.5px rgba(255,255,255,1),
    inset 0 -1.5px 2.5px rgba(255,255,255,.65),
    inset 0 0 22px rgba(255,255,255,.45),
    0 14px 32px -6px rgba(18,22,32,.20),
    0 3px 8px rgba(0,0,0,.08);
}
.lg-btn:active{
  transform:translateY(.5px) scale(.975);
}
.lg-btn:focus-visible{
  outline:2px solid rgba(0,122,255,.6);
  outline-offset:4px;
}
#go{
  padding:14px 38px;
}
#pauseBtn,#cancelBtn{
  padding:14px 28px;
  min-width:124px;
  text-align:center;
}
#hideBtn{
  padding:14px 18px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  letter-spacing:.08em;
  font-size:13px;
}
#hideBtn svg{
  width:15px;
  height:15px;
  stroke:currentColor;
  stroke-width:2;
  fill:none;
  stroke-linecap:round;
  stroke-linejoin:round;
}
/* Subtle corner restore pill when UI is hidden */
#showBtn{
  position:fixed;
  right:18px;
  bottom:calc(env(safe-area-inset-bottom,0px) + 18px);
  padding:9px 14px;
  font-size:11px;
  letter-spacing:.08em;
  opacity:0;
  pointer-events:none;
  z-index:10;
}
#showBtn.vis{
  opacity:.22;
  pointer-events:auto;
}
#showBtn.vis:hover{
  opacity:.95;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h1 id="title">탐구1 영역</h1>
  <div id="face"></div>
  <div id="lab"><div>START - TIME<br>03:35 P.M.</div><div>END - TIME<br>04:05 P.M.</div></div>
</div>

<div id="dock">
  <button id="go" class="lg-btn" type="button">START</button>
  <div id="runCtrls" class="btn-group hidden">
    <button id="pauseBtn" class="lg-btn" type="button">PAUSE</button>
    <button id="cancelBtn" class="lg-btn" type="button">CANCEL</button>
  </div>
  <button id="hideBtn" class="lg-btn" type="button" title="버튼 숨기기 (H)">
    <svg viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
    <span>숨기기</span>
  </button>
</div>
<button id="showBtn" class="lg-btn" type="button" title="버튼 표시 (H)">UI 표시</button>

<script>
/* ---------- clock face (SVG) ---------- */
(function(){
  let t='';
  for(let i=0;i<12;i++){
    const a=i*Math.PI/6,s=Math.sin(a),c=-Math.cos(a),M=i%3===0;
    const r1=M?85:90,r2=M?97:96;
    t+=`<line x1="${(s*r1).toFixed(2)}" y1="${(c*r1).toFixed(2)}" x2="${(s*r2).toFixed(2)}" y2="${(c*r2).toFixed(2)}" stroke="${M?'#5a5a5a':'#a9a9a9'}" stroke-width="${M?1.5:.8}"/>`;
  }
  const mA=210*Math.PI/180, hx=88*Math.sin(mA), hy=-88*Math.cos(mA);
  document.getElementById('face').innerHTML=
  `<svg viewBox="-109 -109 218 218">
    <defs>
      <radialGradient id="gl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffb9a4" stop-opacity=".30"/><stop offset="1" stop-color="#ffd9a8" stop-opacity="0"/></radialGradient>
      <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b3308f"/><stop offset=".55" stop-color="#d9568a"/><stop offset="1" stop-color="#f6ac5e"/></linearGradient>
      <filter id="in" x="-20%" y="-20%" width="140%" height="140%">
        <feFlood flood-color="#3a0828" flood-opacity=".6" result="c"/>
        <feComposite in="c" in2="SourceAlpha" operator="out" result="inv"/>
        <feOffset in="inv" dx="1.8" dy="2.6" result="off"/>
        <feGaussianBlur in="off" stdDeviation="1.8" result="bl"/>
        <feComposite in="bl" in2="SourceAlpha" operator="in" result="sh"/>
        <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="sh"/></feMerge>
      </filter>
      <filter id="ds" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx=".9" dy="1.4" stdDeviation=".9" flood-color="#000" flood-opacity=".28"/></filter>
    </defs>
    <g id="tk"><circle cx="-4" cy="-22" r="70" fill="url(#gl)"/>
    ${t}</g><g id="hd">
    <g filter="url(#in)"><g transform="rotate(25)"><rect x="13" y="-12.5" width="64" height="25" rx="12.5" fill="url(#pg)"/></g></g>
    <line x1="0" y1="0" x2="${hx.toFixed(2)}" y2="${hy.toFixed(2)}" stroke="#171717" stroke-width="2.3" stroke-linecap="round" filter="url(#ds)"/></g>
  </svg>`;
})();

/* ---------- WebGL cloth (Wrinkle-Free Axisymmetric Membrane Model) ---------- */
const cv=document.getElementById('c'),ui=document.getElementById('ui'),face=document.getElementById('face'),
      title=document.getElementById('title'),lab=document.getElementById('lab'),
      dock=document.getElementById('dock'),btn=document.getElementById('go'),
      runCtrls=document.getElementById('runCtrls'),pauseBtn=document.getElementById('pauseBtn'),cancelBtn=document.getElementById('cancelBtn'),
      hideBtn=document.getElementById('hideBtn'),showBtn=document.getElementById('showBtn'),
      tk=document.getElementById('tk'),hd=document.getElementById('hd');
const gl=cv.getContext('webgl',{antialias:false,alpha:false});

const VS='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
const FS=`precision highp float;
uniform vec2 uRes,uC;uniform float uR,uH,uB;
float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}

/*
 * Axisymmetric wrinkle-free membrane profile z(r) & radial slope dz/dr
 * ported from evaluateMembraneProfile(r, h, R, stiffness):
 * - r <= rInner: flat contact on top of the circular disc (z = h, dz/dr = 0)
 * - rInner < r < rOuter: C2 smooth fillet across the disc rim (r = 1)
 * - r >= rOuter: logarithmic-hyperbolic taut membrane decay (1 + u)^(-p) * exp(-0.08*u^2/(1+u))
 */
vec2 evalMembrane(float r, float H){
  if(H<=1e-5)return vec2(0.);
  float fillet=.036*(1.3-.3*H);
  float rInner=1.-fillet, rOuter=1.+fillet, width=2.*fillet;
  float L=.135*(.55+.45*sqrt(H));
  float decayP=1.75, uMax=2.5;
  float h=.34*H;

  float s=clamp((r-rInner)/width,0.,1.);
  float dEff=max(r-rOuter,0.)+fillet*s*s*s*(2.-s);
  float ddDr=s*s*(3.-2.*s);

  float u=dEff/L;
  float u1=1.+u;
  float core=pow(u1,-decayP)*exp(-.08*u*u/u1);
  float dcoreDu=core*(-decayP/u1-(.16*u+.08*u*u)/(u1*u1));

  float w=clamp(1.-u/uMax,0.,1.);
  float win=w*w*w*(10.-15.*w+6.*w*w);
  float dwinDu=u<uMax?-30.*w*w*(1.-w)*(1.-w)/uMax:0.;

  float factor=core*win;
  float dfdu=dcoreDu*win+core*dwinDu;

  float z=h*factor;
  float dzdr=(h/L)*dfdu*ddDr;
  return vec2(z,dzdr);
}

void main(){
  vec2 f=gl_FragCoord.xy,q=(f-uC)/uR;
  float r=length(q);
  vec2 dir=r>1e-5?q/r:vec2(1.,0.);

  vec2 mem=evalMembrane(r,uH);
  float hb=mem.x, dzdr=mem.y;
  vec2 grad=dzdr*dir;

  vec2 wv=f*1.9;
  vec2 mb=.01*vec2(cos(wv.x)*sin(wv.y),sin(wv.x)*cos(wv.y));
  vec3 n=normalize(vec3(-grad.x-mb.x,-grad.y-mb.y,1.));
  vec3 L=normalize(vec3(-.6,.6,.42));              /* key light: top-left corner */
  float diff=dot(n,L)-L.z;

  /* Continuous soft horizon occlusion from the raised disc rim along light direction L.xy */
  float occ=0.;
  if(uH>1e-4 && r>.96){
    for(int i=1;i<=16;i++){
      float t=float(i)*.016;
      float rs=length(q+L.xy*t);
      float zs=evalMembrane(rs,uH).x;
      occ=max(occ,max(0.,(zs-hb)/(t+.012)));
    }
  }
  float shDrop=occ/(1.+1.15*occ);
  float sh=1.-shDrop;

  float lf=dot(f/uRes-.5,vec2(-.7,.7));
  float g=diff<0.?.36*diff:.16*diff/(1.+1.6*diff);
  vec3 cloth=vec3(.945,.94,.935)*(.98+g)*(1.-.34*(1.-sh))*(1.+.10*lf);
  vec3 hi=max(cloth-.9,0.);
  cloth=min(cloth,vec3(.9))+hi/(1.+10.*hi);        /* soft shoulder instead of hard clip */
  vec3 dark=(vec3(.035,.037,.04)+vec3(.16,.17,.18)*max(diff,0.))*(1.-.5*(1.-sh));
  vec3 col=mix(dark,cloth,uB)+(hash(f)-.5)/255.;
  gl_FragColor=vec4(col,1.);
}`;

let U={},W,Hh,R,cx,cy,dpr;
if(gl){
  const mk=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o};
  const pr=gl.createProgram();
  gl.attachShader(pr,mk(gl.VERTEX_SHADER,VS));gl.attachShader(pr,mk(gl.FRAGMENT_SHADER,FS));
  gl.linkProgram(pr);gl.useProgram(pr);
  gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  ['uRes','uC','uR','uH','uB'].forEach(k=>U[k]=gl.getUniformLocation(pr,k));
}

/* ---------- state / timeline ----------
 * - START button: triggers 'rise' -> 'hold' and switches buttons to PAUSE/RESUME + CANCEL.
 * - PAUSE/RESUME button: toggles label between PAUSE and RESUME on click (UI toggle only).
 * - CANCEL button: triggers 'drop' (1s sequential reverse fade: Text -> Hands -> Ticks, then disc drops)
 *   and switches buttons back to START.
 */
let H=0,kT=0,kH=0,kX=0,dH=1,dT=1,dHnd=1,dX=1,phase='idle',t0=0,uiHidden=false,isPaused=false;
const RISE=1600,APPEAR_T0=1250,STAGE_IN=1000/6,DUR_IN=280;
const FADE_OUT_TOTAL=1000,STAGE_OUT=FADE_OUT_TOTAL/3,DROP=1200;

const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const sm=(a,b,v)=>{v=clamp((v-a)/(b-a),0,1);return v*v*(3-2*v)};
const easeSine=t=>.5-.5*Math.cos(Math.PI*clamp(t,0,1));

function showRunningButtons(running){
  btn.classList.toggle('hidden',running);
  runCtrls.classList.toggle('hidden',!running);
  if(running){
    isPaused=false;
    pauseBtn.textContent='PAUSE';
  }
}

function draw(){
  tk.style.opacity=kT;hd.style.opacity=kH;title.style.opacity=kX;lab.style.opacity=kX;
  if(!gl)return;
  gl.uniform2f(U.uRes,cv.width,cv.height);
  gl.uniform2f(U.uC,cx*dpr,(Hh-cy)*dpr);
  gl.uniform1f(U.uR,R*dpr);
  gl.uniform1f(U.uH,H);
  gl.uniform1f(U.uB,1.);
  gl.drawArrays(gl.TRIANGLES,0,3);
}
function frame(now){
  const t=now-t0;
  if(phase==='rise'){
    H=easeSine(t/RISE);
    kT=sm(0,DUR_IN,t-APPEAR_T0);
    kH=sm(0,DUR_IN,t-APPEAR_T0-STAGE_IN);
    kX=sm(0,DUR_IN,t-APPEAR_T0-2*STAGE_IN);
    const riseTotal=Math.max(RISE,APPEAR_T0+2*STAGE_IN+DUR_IN);
    if(t>=riseTotal){phase='hold';t0=now;H=1;kT=kH=kX=1}
  }else if(phase==='drop'){
    /* Step 1 (0 ~ 1000ms): Text -> Hands -> Ticks vanish sequentially while disc stays at dH */
    kX=dX*(1-sm(0,STAGE_OUT,t));
    kH=dHnd*(1-sm(STAGE_OUT,2*STAGE_OUT,t));
    kT=dT*(1-sm(2*STAGE_OUT,3*STAGE_OUT,t));
    /* Step 2 (1000ms ~ 1000+DROP ms): Disc drops down after elements have vanished */
    H=t<=FADE_OUT_TOTAL?dH:dH*(1-easeSine((t-FADE_OUT_TOTAL)/DROP));
    if(t>=FADE_OUT_TOTAL+DROP){
      phase='idle';H=0;kT=kH=kX=0;
      showRunningButtons(false);
    }
  }
  draw();
  if(phase==='rise'||phase==='drop')requestAnimationFrame(frame);
}
function start(){
  if(phase!=='idle')return;
  phase='rise';t0=performance.now();
  showRunningButtons(true);
  requestAnimationFrame(frame);
}
function cancel(){
  if(phase!=='rise'&&phase!=='hold')return;
  dH=H;dT=kT;dHnd=kH;dX=kX;
  phase='drop';t0=performance.now();
  showRunningButtons(false);
  requestAnimationFrame(frame);
}
function setUiHidden(hide){
  uiHidden=hide;
  dock.classList.toggle('ui-hidden',hide);
  showBtn.classList.toggle('vis',hide);
}
btn.addEventListener('click',start);
pauseBtn.addEventListener('click',e=>{
  e.stopPropagation();
  isPaused=!isPaused;
  pauseBtn.textContent=isPaused?'RESUME':'PAUSE';
});
cancelBtn.addEventListener('click',e=>{
  e.stopPropagation();
  cancel();
});
hideBtn.addEventListener('click',e=>{
  e.stopPropagation();
  setUiHidden(true);
});
showBtn.addEventListener('click',e=>{
  e.stopPropagation();
  setUiHidden(false);
});
addEventListener('keydown',e=>{
  if(e.key==='h'||e.key==='H'){setUiHidden(!uiHidden)}
});
document.addEventListener('pointerdown',e=>{
  if(e.target.closest('#dock')||e.target.closest('#showBtn'))return;
  if(uiHidden){
    if(phase==='idle')start();
    else if(phase==='hold'||phase==='rise')cancel();
  }
});

function layout(){
  W=innerWidth;Hh=innerHeight;dpr=Math.min(devicePixelRatio||1,2);
  cv.width=Math.round(W*dpr);cv.height=Math.round(Hh*dpr);
  if(gl)gl.viewport(0,0,cv.width,cv.height);
  R=Math.min(W*.38,Hh*.27,330);cx=W/2;cy=Hh*.5;
  face.style.cssText=`left:${cx-R}px;top:${cy-R}px;width:${2*R}px;height:${2*R}px`;
  title.style.top=(cy-R*1.3)+'px';
  title.style.fontSize=clamp(R*.2,26,58)+'px';
  lab.style.cssText=`left:${cx-R}px;top:${cy+R*1.2}px;width:${2*R}px;font-size:${clamp(R*.085,11,17)}px`;
  draw();
}
addEventListener('resize',layout);
layout();
</script>
</body>
</html>
