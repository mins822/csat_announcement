    <script>
      (function(){
        var base = '%BASE_URL%';
        function applyEarlyThemeAndIcons(){
          try{
            var raw=localStorage.getItem('csat_timer_custom_settings_v2');
            var pref='auto';
            if(raw){
              var p=JSON.parse(raw);
              if(p&&['auto','light','dark','sepia'].indexOf(p.themePref)!==-1) pref=p.themePref;
            }
            var sysDark=Boolean(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
            var resolved=pref==='auto'?(sysDark?'dark':'light'):pref;
            var isDark=(resolved==='dark');
            var themeHex=isDark?'#121212':(resolved==='sepia'?'#e6dcc8':'#ecebe9');
            document.documentElement.setAttribute('data-theme',resolved);
            document.documentElement.style.colorScheme=isDark?'dark':'light';

            var tcActive=document.getElementById('theme-color-active');
            if(tcActive) tcActive.setAttribute('content',themeHex);

            var favicon=document.getElementById('app-favicon');
            if(favicon){
              favicon.setAttribute('href',base+(isDark?'favicon-dark.svg':'favicon-light.svg'));
            }
          }catch(e){
            document.documentElement.setAttribute('data-theme','light');
          }
        }
        applyEarlyThemeAndIcons();
        document.addEventListener('DOMContentLoaded', applyEarlyThemeAndIcons);
        if(window.matchMedia){
          var mq = window.matchMedia('(prefers-color-scheme: dark)');
          if(mq.addEventListener) mq.addEventListener('change', applyEarlyThemeAndIcons);
          else if(mq.addListener) mq.addListener(applyEarlyThemeAndIcons);
        }
      })();
    </script>
